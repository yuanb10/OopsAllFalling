<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Oops All Empires</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; overflow:hidden; }
  body {
    font-family:'Trebuchet MS','Segoe UI',sans-serif;
    background:#2b1d12;
    background-image:radial-gradient(circle at 50% 30%, #3d2a18 0%, #2b1d12 70%);
    display:flex; justify-content:center; align-items:flex-start; color:#f5e9d0;
    user-select:none; -webkit-user-select:none; touch-action:none;
  }
  #phone { width:420px; max-width:100vw; height:100%; max-height:880px; position:relative;
    background:#1d140c; display:flex; flex-direction:column; box-shadow:0 0 50px rgba(0,0,0,.7); overflow:hidden; }
  /* top bar */
  #topbar { display:flex; align-items:center; gap:6px; padding:6px 8px; z-index:5;
    background:linear-gradient(#5a3d22,#4a3018); border-bottom:3px solid #2b1d12; font-size:13px; font-weight:bold; }
  .res { background:#2b1d12; border:2px solid #8a6a3f; border-radius:12px; padding:2px 8px; white-space:nowrap; }
  #ageTag { background:#7a5c2e; border:2px solid #d9b96a; border-radius:12px; padding:2px 8px; }
  #timer { margin-left:auto; color:#d9b96a; }
  #muteBtn { cursor:pointer; }
  /* canvas */
  #wrap { position:relative; flex:1; min-height:0; }
  canvas { display:block; width:100%; height:100%; }
  /* command bar */
  #cmdbar { background:linear-gradient(#5a3d22,#3d2812); border-top:3px solid #2b1d12;
    padding:8px; display:grid; grid-template-columns:repeat(3,1fr); gap:6px; z-index:5; }
  .cbtn { font-family:inherit; font-size:12px; font-weight:bold; color:#f5e9d0; cursor:pointer;
    background:linear-gradient(#7a5c2e,#5f4522); border:2px solid #d9b96a; border-radius:10px;
    padding:8px 4px; box-shadow:0 2px 0 #2b1d12; line-height:1.25; }
  .cbtn:active { transform:translateY(2px); box-shadow:none; }
  .cbtn:disabled { opacity:.38; }
  .cbtn.warn { border-color:#e86a5e; }
  #hint { grid-column:1/-1; text-align:center; font-size:11px; color:#d9b96a; min-height:14px; }
  /* build menu */
  #buildmenu { position:absolute; left:8px; right:8px; bottom:8px; z-index:15; display:none;
    background:#f5e9d0; color:#3a2c1a; border:3px solid #2b1d12; border-radius:14px; padding:10px; }
  #buildmenu.show { display:block; }
  #buildmenu h4 { margin-bottom:6px; }
  .brow { display:flex; gap:6px; }
  .bbtn { flex:1; font-family:inherit; font-size:12px; font-weight:bold; cursor:pointer;
    background:#fffdf4; border:2px solid #3a2c1a; border-radius:10px; padding:8px 4px; }
  .bbtn small { display:block; font-weight:normal; font-size:10px; color:#6a5a3a; }
  /* overlays */
  .overlay { position:absolute; inset:0; z-index:30; background:rgba(20,12,6,.88);
    display:flex; align-items:center; justify-content:center; padding:20px; }
  .overlay.hidden { display:none; }
  .panel { background:linear-gradient(#f7efdb,#e8d9b8); color:#3a2c1a; border:4px solid #2b1d12;
    border-radius:16px; padding:24px 20px; max-width:340px; text-align:center;
    box-shadow:0 8px 0 rgba(0,0,0,.5); }
  .panel h1 { font-size:30px; letter-spacing:1px; margin-bottom:2px; color:#7a2e1d; }
  .panel .sub { font-size:13px; color:#6a5a3a; margin-bottom:12px; }
  .panel ul { text-align:left; font-size:13px; margin:0 0 14px 16px; }
  .panel li { margin-bottom:5px; }
  .bigbtn { font-family:inherit; font-size:18px; font-weight:bold; cursor:pointer; color:#f5e9d0;
    background:linear-gradient(#a03d2a,#7a2e1d); border:3px solid #2b1d12; border-radius:12px;
    padding:10px 30px; box-shadow:0 3px 0 #2b1d12; }
  .bigbtn:active { transform:translateY(2px); box-shadow:none; }
  #endStats { font-size:14px; margin:10px 0 16px; line-height:1.6; }
</style>
</head>
<body>
<div id="phone">
  <div id="topbar">
    <span class="res">🪵 <span id="rWood">0</span></span>
    <span class="res">🪙 <span id="rGold">0</span></span>
    <span class="res">👥 <span id="rPop">0</span>/<span id="rCap">10</span></span>
    <span id="ageTag">租房時代</span>
    <span id="timer">0:00</span>
    <span id="muteBtn">🔊</span>
  </div>
  <div id="wrap"><canvas id="cv"></canvas>
    <button id="placeCancel" style="display:none;position:absolute;top:8px;right:8px;z-index:16;font-family:inherit;font-size:13px;font-weight:bold;color:#f5e9d0;background:#a03d2a;border:2px solid #f5e9d0;border-radius:10px;padding:6px 12px;cursor:pointer;">✕ 取消建造</button>
    <div id="buildmenu"><h4>🏗️ Build <span style="font-size:11px;color:#6a5a3a">(tap map to place)</span></h4>
      <div class="brow">
        <button class="bbtn" data-b="house">🏠 House<small>40🪵 · +5 pop</small></button>
        <button class="bbtn" data-b="barracks">⚔️ Barracks<small>120🪵 · trains army</small></button>
        <button class="bbtn" data-b="tower">🗼 Tower<small>80🪵 40🪙 · shoots</small></button>
      </div>
      <div class="brow" style="margin-top:6px"><button class="bbtn" id="buildCancel">Cancel</button></div>
    </div>
  </div>
  <div id="cmdbar">
    <button class="cbtn" id="btnVill">🧑‍🌾 工人<br><small>50🪵</small></button>
    <button class="cbtn" id="btnSold">🛡️ 士兵<br><small>30🪵 40🪙</small></button>
    <button class="cbtn" id="btnKnight">🐎 騎士<br><small>50🪵 80🪙</small></button>
    <button class="cbtn" id="btnBuild">🏠 建造</button>
    <button class="cbtn warn" id="btnAge">⬆️ 升級時代<br><small>250🪵 250🪙</small></button>
    <button class="cbtn" id="btnAttack">⚔️ 全軍出擊</button>
    <div id="hint">點選單位，再點目的地。閒置工人會自動找活幹。</div>
  </div>
  <div class="overlay" id="titleScr"><div class="panel">
    <h1>OOPS ALL<br>EMPIRES</h1>
    <div class="sub">房租戰爭 · a tiny RTS</div>
    <ul>
      <li>🧑‍🌾 派工人砍樹、挖金礦，壯大經濟</li>
      <li>🏠 蓋房子加人口、兵營出兵、高塔防守</li>
      <li>⬆️ 租房時代 → 買房時代 → 包租公時代</li>
      <li>⚔️ 推掉包租公的老家就贏！守住自己的老家！</li>
    </ul>
    <button class="bigbtn" id="startBtn">開戰</button>
    <div class="sub" style="margin:12px 0 0">an OopsAllFalling joint</div>
  </div></div>
  <div class="overlay hidden" id="endScr"><div class="panel">
    <div id="endTitle" style="font-size:28px;margin-bottom:4px"></div>
    <div id="endStats"></div>
    <button class="bigbtn" id="againBtn">再來一局</button>
  </div></div>
</div>
<script>
// ================= CONFIG =================
const W=420, H=600;
const AGES=['租房時代','買房時代','包租公時代'];
const TEAM_C=['#2f6fd0','#d0342c'];
const TEAM_D=['#1e4f9e','#9e231c'];
const COST={
  vill:{w:50,g:0,t:6}, sold:{w:30,g:40,t:8}, knight:{w:50,g:80,t:10},
  house:{w:40,g:0,t:8}, barracks:{w:120,g:0,t:12}, tower:{w:80,g:40,t:10},
  age1:{w:250,g:250,t:20}, age2:{w:500,g:500,t:25},
};
const STATS={
  vill:{hp:45,sp:60,dmg:3,rng:14,cd:1.2,pop:1},
  sold:{hp:95,sp:78,dmg:9,rng:20,cd:1.0,pop:1},
  knight:{hp:170,sp:88,dmg:16,rng:22,cd:1.1,pop:1},
  tc:{hp:1500}, house:{hp:350}, barracks:{hp:600}, tower:{hp:450,dmg:11,rng:150,cd:1.3},
};
// ================= UTILS =================
const $=id=>document.getElementById(id);
const cv=$('cv'), ctx=cv.getContext('2d');
const R=(a,b)=>a+Math.random()*(b-a);
const RI=(a,b)=>Math.floor(R(a,b+1));
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function angTo(a,b){ return Math.atan2(b.y-a.y,b.x-a.x); }
// ================= AUDIO =================
let AC=null, muted=false;
function tone(f,d,type='triangle',v=.08,slide=0){
  if(muted) return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(), g=AC.createGain();
    o.type=type; o.frequency.value=f;
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide),AC.currentTime+d);
    g.gain.value=v; o.connect(g); g.connect(AC.destination); o.start();
    g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d); o.stop(AC.currentTime+d);
  }catch(e){}
}
const sfx={
  select:()=>tone(700,.08),
  train:()=>tone(500,.15,'square',.05),
  build:()=>{tone(200,.2,'sawtooth',.06); setTimeout(()=>tone(260,.2,'sawtooth',.06),120);},
  hit:()=>tone(R(150,220),.08,'sawtooth',.05),
  gather:()=>tone(R(900,1200),.05,'sine',.03),
  ageup:()=>{[523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,.25,'triangle',.09),i*140));},
  boom:()=>tone(90,.5,'sawtooth',.12,-40),
  arrow:()=>tone(1200,.06,'sine',.03,-600),
};
// ================= TERRAIN (prerendered) =================
let terrain=null;
function makeTerrain(){
  terrain=document.createElement('canvas'); terrain.width=W; terrain.height=H;
  const c=terrain.getContext('2d');
  const g=c.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#7fae5a'); g.addColorStop(.5,'#8fbc63'); g.addColorStop(1,'#7fae5a');
  c.fillStyle=g; c.fillRect(0,0,W,H);
  // noise patches
  for(let i=0;i<260;i++){
    c.fillStyle=`rgba(${RI(90,130)},${RI(150,180)},${RI(70,100)},0.25)`;
    c.beginPath(); c.ellipse(R(0,W),R(0,H),R(6,26),R(4,16),R(0,3),0,7); c.fill();
  }
  // dirt clearings at bases
  for(const y of [540,60]){
    const dg=c.createRadialGradient(W/2,y,10,W/2,y,110);
    dg.addColorStop(0,'rgba(196,164,110,.85)'); dg.addColorStop(1,'rgba(196,164,110,0)');
    c.fillStyle=dg; c.beginPath(); c.arc(W/2,y,110,0,7); c.fill();
  }
  // pond (decorative, right side)
  c.fillStyle='#5fa8d3'; c.beginPath(); c.ellipse(348,300,42,58,0.3,0,7); c.fill();
  c.fillStyle='#7cc4e8'; c.beginPath(); c.ellipse(340,292,26,36,0.3,0,7); c.fill();
  c.strokeStyle='#4a8ab5'; c.lineWidth=3; c.beginPath(); c.ellipse(348,300,42,58,0.3,0,7); c.stroke();
  // flowers & pebbles
  for(let i=0;i<40;i++){
    const x=R(8,W-8),y=R(8,H-8);
    if(Math.hypot(x-348,y-300)<55) continue;
    if(Math.random()<.5){ c.fillStyle=['#fff','#ffd94a','#ff9ecb'][RI(0,2)];
      c.beginPath(); c.arc(x,y,2.2,0,7); c.fill(); c.fillStyle='#4e8a3a'; c.fillRect(x-1,y+2,2,5);
    } else { c.fillStyle='rgba(120,120,120,.5)'; c.beginPath(); c.arc(x,y,R(1.5,3),0,7); c.fill(); }
  }
  // middle dividing hills (decorative)
  c.fillStyle='rgba(110,140,80,.35)';
  for(let i=0;i<8;i++){ c.beginPath(); c.ellipse(R(0,W),R(270,330),R(20,44),R(8,14),0,0,7); c.fill(); }
}
// ================= ART =================
function shadow(c,x,y,rx,ry){
  c.fillStyle='rgba(0,0,0,.22)'; c.beginPath(); c.ellipse(x,y,rx,ry,0,0,7); c.fill();
}
function drawTree(c,x,y,s,ph){
  shadow(c,x,y+10*s,10*s,3.5*s);
  c.fillStyle='#6b4a2a'; c.fillRect(x-2.5*s,y-2*s,5*s,14*s);
  const sway=Math.sin(ph+x)*1.5*s;
  const layers=[['#2f6b2f',16],['#3d8a3d',12.5],['#4da34d',9]];
  layers.forEach(([col,r],i)=>{
    c.fillStyle=col; c.beginPath();
    c.moveTo(x- r*s+sway*(i+1)*.3, y-2*s-i*9*s);
    c.lineTo(x+sway*(i+1)*.3, y-2*s-i*9*s-r*1.5*s);
    c.lineTo(x+ r*s+sway*(i+1)*.3, y-2*s-i*9*s);
    c.closePath(); c.fill();
  });
}
function drawMine(c,x,y,s,amt){
  shadow(c,x,y+8*s,14*s,4*s);
  c.fillStyle='#8d8d94'; c.beginPath(); c.ellipse(x,y,13*s,9*s,0,0,7); c.fill();
  c.fillStyle='#a5a5ad'; c.beginPath(); c.ellipse(x-3*s,y-3*s,9*s,6*s,0,0,7); c.fill();
  c.fillStyle='#6e6e76';
  c.beginPath(); c.arc(x-4*s,y-2*s,3*s,0,7); c.fill();
  c.beginPath(); c.arc(x+5*s,y+1*s,2.4*s,0,7); c.fill();
  const n=Math.ceil(amt/40);
  c.fillStyle='#ffd94a';
  for(let i=0;i<n;i++){ const a=R(0,6.28),rr=R(2,9)*s;
    c.save(); c.translate(x+Math.cos(a)*rr,y-2*s+Math.sin(a)*rr*.6); c.rotate(a);
    c.fillRect(-2*s,-1.4*s,4*s,2.8*s); c.restore(); }
}
function drawVillager(c,u){
  const s=1, bob=u.state==='move'?Math.abs(Math.sin(u.phase))*2:0;
  const tc=TEAM_C[u.team];
  shadow(c,u.x,u.y+9,7,2.6);
  c.save(); c.translate(u.x,u.y-bob);
  // legs
  c.fillStyle='#5a4028';
  const lp=u.state==='move'?Math.sin(u.phase)*3:0;
  c.fillRect(-4,-2+lp*.4,3,8); c.fillRect(1,-2-lp*.4,3,8);
  // tunic
  c.fillStyle=tc; c.fillRect(-6,-14,12,13);
  c.fillStyle='rgba(0,0,0,.18)'; c.fillRect(-6,-4,12,3);
  // belt
  c.fillStyle='#3a2c1a'; c.fillRect(-6,-7,12,2.5);
  // head
  c.fillStyle='#f2c99a'; c.beginPath(); c.arc(0,-18,5.5,0,7); c.fill();
  // cap
  c.fillStyle=TEAM_D[u.team]; c.beginPath(); c.arc(0,-19.5,5.5,Math.PI,0); c.fill();
  c.fillRect(-5.5,-20,11,2);
  // tool
  if(u.carry){ c.strokeStyle='#6b4a2a'; c.lineWidth=2.5;
    c.beginPath(); c.moveTo(6,-10); c.lineTo(11,-18); c.stroke();
    c.fillStyle=u.carry==='w'?'#7a5a34':'#ffd94a'; c.fillRect(8,-22,6,5); }
  c.restore();
}
function drawSoldier(c,u){
  const bob=u.state==='move'?Math.abs(Math.sin(u.phase))*2.2:Math.sin(u.phase*.3)*.6;
  const lunge=u.atkT>0? (0.35-u.atkT)*22 : 0;
  const tc=TEAM_C[u.team];
  shadow(c,u.x,u.y+9,7.5,2.8);
  c.save(); c.translate(u.x,u.y-bob);
  const fx=Math.cos(u.face), fy=Math.sin(u.face);
  c.translate(fx*lunge,fy*lunge);
  c.fillStyle='#4a3a28';
  const lp=u.state==='move'?Math.sin(u.phase)*3.2:0;
  c.fillRect(-4,-2+lp*.4,3,8); c.fillRect(1,-2-lp*.4,3,8);
  // armor
  c.fillStyle='#9aa2ad'; c.fillRect(-6.5,-15,13,14);
  c.fillStyle=tc; c.fillRect(-6.5,-15,13,3.5);
  c.fillStyle='rgba(0,0,0,.2)'; c.fillRect(-6.5,-5,13,4);
  // head + helmet
  c.fillStyle='#f2c99a'; c.beginPath(); c.arc(0,-19,5.5,0,7); c.fill();
  c.fillStyle='#7d8894'; c.beginPath(); c.arc(0,-20,6,Math.PI*.95,Math.PI*2.05); c.fill();
  c.fillStyle='#7d8894'; c.fillRect(-6,-22,12,3);
  // shield
  c.save(); c.translate(-8,-10); c.rotate(u.face*.15);
  c.fillStyle='#6b4a2a'; c.beginPath(); c.arc(0,0,6,0,7); c.fill();
  c.fillStyle=tc; c.beginPath(); c.arc(0,0,4.2,0,7); c.fill(); c.restore();
  // sword
  c.save(); c.translate(8,-10); c.rotate(-.5+ (u.atkT>0? -.9:0));
  c.fillStyle='#8d8d94'; c.fillRect(-1.2,-14,2.4,12);
  c.fillStyle='#6b4a2a'; c.fillRect(-3.5,-3,7,2.6); c.restore();
  c.restore();
}
function drawKnight(c,u){
  const bob=u.state==='move'?Math.abs(Math.sin(u.phase))*2.6:Math.sin(u.phase*.3)*.7;
  const lunge=u.atkT>0? (0.35-u.atkT)*26 : 0;
  const tc=TEAM_C[u.team];
  shadow(c,u.x,u.y+10,9,3.2);
  c.save(); c.translate(u.x,u.y-bob);
  const fx=Math.cos(u.face), fy=Math.sin(u.face);
  c.translate(fx*lunge,fy*lunge);
  c.fillStyle='#3d2f20';
  const lp=u.state==='move'?Math.sin(u.phase)*3.6:0;
  c.fillRect(-4.5,-2+lp*.4,3.4,9); c.fillRect(1,-2-lp*.4,3.4,9);
  // plate armor
  c.fillStyle='#b9c1cc'; c.fillRect(-7,-16,14,15);
  c.fillStyle=tc; c.fillRect(-7,-16,14,4);
  c.strokeStyle='rgba(0,0,0,.25)'; c.lineWidth=1;
  c.beginPath(); c.moveTo(-7,-8); c.lineTo(7,-8); c.stroke();
  // pauldrons
  c.fillStyle='#9aa2ad';
  c.beginPath(); c.arc(-7,-13,4.5,0,7); c.fill();
  c.beginPath(); c.arc(7,-13,4.5,0,7); c.fill();
  // helm + plume
  c.fillStyle='#8d97a3'; c.beginPath(); c.arc(0,-20,6,0,7); c.fill();
  c.fillStyle='#3a3f47'; c.fillRect(-4,-22,8,2.4);
  c.strokeStyle=tc; c.lineWidth=2.4;
  c.beginPath(); c.moveTo(0,-26); c.quadraticCurveTo(4,-30,7,-27+Math.sin(u.phase*2)*1.5); c.stroke();
  // lance
  c.save(); c.translate(9,-11); c.rotate(-.35+(u.atkT>0?-1:0));
  c.strokeStyle='#6b4a2a'; c.lineWidth=2.6;
  c.beginPath(); c.moveTo(0,4); c.lineTo(0,-20); c.stroke();
  c.fillStyle='#c9d2dc'; c.beginPath(); c.moveTo(-3,-20); c.lineTo(3,-20); c.lineTo(0,-26); c.closePath(); c.fill();
  c.fillStyle=tc; c.fillRect(-2.4,-16,4.8,4); c.restore();
  c.restore();
}
function drawBuilding(c,b,t){
  const tc=TEAM_C[b.team], td=TEAM_D[b.team];
  const w=b.w, h=b.h, x=b.x-w/2, y=b.y-h/2;
  shadow(c,b.x,b.y+h/2, w*.55, 7);
  if(b.buildT>0){ // scaffold
    c.strokeStyle='#8a6a3f'; c.lineWidth=2.5;
    const p=1-b.buildT/b.buildMax;
    c.strokeRect(x,y,w,h);
    c.beginPath(); c.moveTo(x,y+h); c.lineTo(x+w,y); c.moveTo(x,y); c.lineTo(x+w,y+h); c.stroke();
    c.fillStyle='rgba(240,220,180,.75)'; c.fillRect(x,y+h*(1-p),w,h*p);
    return;
  }
  c.save();
  if(b.type==='tc'){
    // stone base
    c.fillStyle='#b9b0a0'; c.fillRect(x,y+h-22,w,22);
    c.fillStyle='#9a9184'; for(let i=0;i<5;i++) c.fillRect(x+6+i*13,y+h-22,2,22);
    // wooden hall
    c.fillStyle='#8a5f36'; c.fillRect(x+6,y+16,w-12,h-38);
    c.fillStyle='#6e4a28';
    for(let i=0;i<4;i++) c.fillRect(x+10+i*((w-20)/4),y+18,3,h-42);
    // roof
    c.fillStyle='#a03d2a';
    c.beginPath(); c.moveTo(x-6,y+20); c.lineTo(x+w/2,y-14); c.lineTo(x+w+6,y+20); c.closePath(); c.fill();
    c.fillStyle='#7a2e1d';
    c.beginPath(); c.moveTo(x+w/2,y-14); c.lineTo(x+w+6,y+20); c.lineTo(x+w-8,y+20); c.closePath(); c.fill();
    c.strokeStyle='#5f2313'; c.lineWidth=2;

  } else if(b.type==='house'){

    c.fillStyle='#3a2c1a'; c.fillRect(x+w/2-5,y+h-16,10,16);

  } else if(b.type==='tower'){
    c.fillStyle='#a5a5ad'; c.fillRect(x+5,y+6,w-10,h-6);
    c.fillStyle='#8d8d94';
    for(let i=0;i<3;i++) c.fillRect(x+5,y+12+i*12,w-10,2);

    const wv=Math.sin(t*4+b.x)*2.5;

}
// ================= STATE =================
let G=null;
function newGame(){
  G={ t:0, over:false, win:false, stats:{lost:0,kills:0},
    sel:null, placeMode:null, particles:[], floats:[], projs:[],
    teams:[
      {wood:220,gold:120,pop:0,cap:10,age:0,ageT:0,tc:null},
      {wood:220,gold:120,pop:0,cap:10,age:0,ageT:0,tc:null},
    ],
    units:[], blds:[], res:[],
  };
  makeTerrain();
  genMap();
  // starting TCs
  for(const team of [0,1]){
    const y=team===0?540:60;
    const tc=addBld(team,'tc',W/2,y);
    G.teams[team].tc=tc;
    for(let i=0;i<3;i++) addUnit(team,'vill',W/2-40+i*40,y+(team===0?-46:46));
  }
  updateHUD();
}
function genMap(){
  // forests (avoid bases & pond)
  const spots=[[70,420],[350,420],[70,180],[350,180],[150,300],[270,300],[60,300],[360,300]];
  for(const [sx,sy] of spots){
    const n=RI(3,5);
    for(let i=0;i<n;i++){
      const x=sx+R(-34,34), y=sy+R(-30,30);
      if(Math.hypot(x-348,y-300)<60||y<40||y>H-40) continue;
      G.res.push({x:clamp(x,14,W-14),y:clamp(y,14,H-14),type:'w',amt:120,ph:R(0,6)});
    }
  }
  // gold mines: near each base + contested center
  const mines=[[120,470],[300,470],[120,130],[300,130],[210,300],[150,250]];
  for(const [x,y] of mines) G.res.push({x,y,type:'g',amt:220,ph:R(0,6)});
}
function addUnit(team,type,x,y){
  const st=STATS[type];
  const u={id:Math.random(),team,type,x:clamp(x,12,W-12),y:clamp(y,12,H-12),
    hp:st.hp,maxhp:st.hp,sp:st.sp,dmg:st.dmg,rng:st.rng,cd:st.cd,cdT:0,
    state:'idle',tx:x,ty:y,target:null,res:null,carry:null,phase:R(0,6),face:team===0?-Math.PI/2:Math.PI/2,
    atkT:0,gathT:0,dead:false,isUnit:true,flashT:0};
  G.units.push(u); G.teams[team].pop+=st.pop;
  return u;
}
function addBld(team,type,x,y){
  const st=STATS[type];
  const dims={tc:[72,64],house:[40,36],barracks:[58,50],tower:[34,54]}[type];
  const b={id:Math.random(),team,type,x:clamp(x,dims[0]/2,W-dims[0]/2),y:clamp(y,dims[1]/2,H-dims[1]/2),
    w:dims[0],h:dims[1],hp:st.hp,maxhp:st.hp,buildT:0,buildMax:0,queue:[],qT:0,cdT:0,dead:false,rally:null,isUnit:false,flashT:0};
  if(type==='house') G.teams[team].cap+=5;
  G.blds.push(b); return b;
}
function startBuild(team,type,x,y){
  const c=COST[type];
  const T=G.teams[team];
  if(T.wood<c.w||T.gold<c.g) return false;
  if(type==='tower'&&T.age<1) return false;
  if(!canPlace(type,x,y)) return false;
  T.wood-=c.w; T.gold-=c.g;
  const b=addBld(team,type,x,y);
  b.hp=1; b.buildT=c.t; b.buildMax=c.t;
  sfx.build(); burst(x,y,'#c9a86a',10);
  return true;
}
function trainUnit(team,type){
  const c=COST[type], T=G.teams[team];
  const home=G.blds.find(b=>!b.dead&&b.team===team&&b.buildT<=0&&
    (type==='vill'?b.type==='tc':b.type==='barracks'));
  if(!home) return false;
  let queued=0;
  for(const b of G.blds) if(b.team===team&&!b.dead) queued+=b.queue.length;
  if(T.wood<c.w||T.gold<c.g||T.pop+queued+STATS[type].pop>T.cap) return false;
  if(type==='knight'&&T.age<1) return false;
  T.wood-=c.w; T.gold-=c.g;
  home.queue.push(type); sfx.train();
  return true;
}
function researchAge(team){
  const T=G.teams[team];
  if(T.age>=2||T.ageT>0) return false;
  const c=T.age===0?COST.age1:COST.age2;
  const tc=G.blds.find(b=>!b.dead&&b.team===team&&b.type==='tc');
  if(!tc) return false;
  if(T.wood<c.w||T.gold<c.g) return false;
  T.wood-=c.w; T.gold-=c.g; T.ageT=c.t; T.ageMax=c.t;
  return true;
}
function ageMult(team){ const a=G.teams[team].age; return a===0?1:a===1?1.25:1.6; }
// ================= ECONOMY =================
function nearestRes(u,type){
  let best=null,bd=1e9;
  for(const r of G.res){ if(r.type!==type||r.amt<=0) continue;
    const d=dist(u,r); if(d<bd){bd=d;best=r;} }
  return best;
}
function updateGather(u,dt){
  const T=G.teams[u.team];
  if(!u.res||u.res.amt<=0){ u.res=nearestRes(u,u.carry==='g'?'g':'w')||nearestRes(u,'w')||nearestRes(u,'g');
    if(!u.res){ u.state='idle'; u.carry=null; return; } }
  const r=u.res, d=dist(u,r);
  if(d>20){ moveToward(u,r.x,r.y,dt,20); return; } // stay in 'gather' while approaching
  u.state='gather'; u.face=angTo(u,r);
  u.gathT+=dt;
  if(u.gathT>=1){
    u.gathT=0;
    const amt=Math.min(7*ageMult(u.team),r.amt);
    r.amt-=amt;
    if(r.type==='w') T.wood+=amt; else T.gold+=amt;
    u.carry=r.type;
    addFloat(u.x,u.y-24,'+'+Math.round(amt)+(r.type==='w'?'🪵':'🪙'),r.type==='w'?'#7a5a34':'#b8962e');
    if(Math.random()<.5) burst(r.x+R(-8,8),r.y-6,r.type==='w'?'#8fd694':'#ffd94a',2);
    if(u.team===0&&Math.random()<.3) sfx.gather();
  }
}
function moveToward(u,tx,ty,dt,stop=4){
  const dx=tx-u.x, dy=ty-u.y, d=Math.hypot(dx,dy);
  if(d<=stop) return true;
  const sp=u.sp*dt;
  u.x=clamp(u.x+dx/d*Math.min(sp,d),12,W-12);
  u.y=clamp(u.y+dy/d*Math.min(sp,d),12,H-12);
  u.face=Math.atan2(dy,dx); u.phase+=dt*10;
  return false;
}
// ================= PARTICLES / FLOATS =================
function burst(x,y,color,n=8,spd=60){
  for(let i=0;i<n;i++){ const a=R(0,6.28),s=R(spd*.3,spd);
    G.particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-30,life:R(.3,.7),t:0,color,sz:R(1.5,3.5)}); }
}
function addFloat(x,y,txt,color){ G.floats.push({x,y,txt,color,t:0,life:1.1}); }
// ================= COMBAT =================
function canPlace(type,x,y){
  const dims={house:[40,36],barracks:[58,50],tower:[34,54]}[type];
  if(x<dims[0]/2+4||x>W-dims[0]/2-4||y<dims[1]/2+4||y>H-dims[1]/2-4) return false;
  for(const b of G.blds){ if(b.dead) continue;
    if(Math.abs(b.x-x)<(b.w+dims[0])/2-4 && Math.abs(b.y-y)<(b.h+dims[1])/2-4) return false; }
  for(const r of G.res){ if(r.amt>0&&Math.hypot(r.x-x,r.y-y)<26) return false; }
  return true;
}
function findSpot(team,type){
  const by=team===0?540:60;
  for(let i=0;i<40;i++){
    const x=R(60,W-60), y=by+R(-90,90)*(team===0?-1:1)*1+R(-30,30);
    const yy=clamp(y,40,H-40);
    if(canPlace(type,x,yy)) return [x,yy];
  }
  return null;
}
function nearestEnemy(u,includeBld=true){
  let best=null,bd=u.type==='vill'?0:150;
  for(const e of G.units){ if(e.team===u.team||e.dead) continue;
    const d=dist(u,e); if(d<bd){bd=d;best=e;} }
  if(!best&&includeBld){ bd=220;
    for(const b of G.blds){ if(b.team===u.team||b.dead) continue;
      const d=dist(u,b)-(b.w/2); if(d<bd){bd=d;best=b;} } }
  return best;
}
function dealDamage(att,tgt){
  let dmg=att.dmg*ageMult(att.team);
  tgt.hp-=dmg;
  tgt.flashT=0.18;
  burst(tgt.x+R(-6,6),tgt.y-10,'#ffd94a',6,70);
  burst(tgt.x,tgt.y-12,'#ffffff',3,90);
  if(Math.random()<.3) sfx.hit();
  // villagers panic and flee
  if(tgt.isUnit&&tgt.type==='vill'&&att.x!==undefined){
    const a=angTo(att,tgt);
    tgt.state='move'; tgt.target=null; tgt.res=null; tgt.carry=null;
    tgt.tx=clamp(tgt.x+Math.cos(a)*90,12,W-12);
    tgt.ty=clamp(tgt.y+Math.sin(a)*90,12,H-12);
  }
  if(tgt.hp<=0&&!tgt.dead) kill(tgt,att.team);
}
function kill(e,byTeam){
  e.dead=true;
  if(e.isUnit){
    G.teams[e.team].pop-=STATS[e.type].pop;
    burst(e.x,e.y,'#c9c2b8',10,70);
    addFloat(e.x,e.y-16,'💀','#5a5a5a');
    if(e.team===0) G.stats.lost++;
    if(byTeam===0) G.stats.kills++;
    if(G.sel===e) G.sel=null;
  } else {
    burst(e.x,e.y,'#8a6a3f',22,110); burst(e.x,e.y,'#5a5a5a',12,60);
    sfx.boom();
    addFloat(e.x,e.y-30,'💥','#a03d2a');
    if(byTeam===0) G.stats.kills++;
    if(e.type==='house') G.teams[e.team].cap-=5;
    if(G.sel===e) G.sel=null;
    if(e.type==='tc') endGame(e.team===1);
  }
}
function fireArrow(from,tx,ty,target,team){
  G.projs.push({x:from.x,y:from.y-20,tx,ty,target,sp:260,dmg:STATS.tower.dmg,team,dead:false});
  sfx.arrow();
}
// ================= UNIT UPDATE =================
function updateUnit(u,dt){
  if(u.cdT>0) u.cdT-=dt;
  if(u.atkT>0) u.atkT-=dt;
  if(u.type==='vill'){
    if(u.state==='gather'){ updateGather(u,dt); return; }
    if(u.state==='move'){
      if(moveToward(u,u.tx,u.ty,dt)){ u.state='idle';
        if(u.res&&u.res.amt>0) u.state='gather'; }
      return;
    }
    // auto-work
    if(!u.res||u.res.amt<=0){ u.res=nearestRes(u,'w')||nearestRes(u,'g'); }
    if(u.res) u.state='gather';
    return;
  }
  // military
  if(u.target&&(u.target.dead)) u.target=null;
  if(!u.target) u.target=nearestEnemy(u);
  const t=u.target;
  if(t){
    const tr=(t.isUnit?10:t.w/2)+u.rng;
    const d=dist(u,t);
    if(d>tr){ moveToward(u,t.x,t.y,dt); u.state='move'; }
    else { u.state='attack'; u.face=angTo(u,t);
      if(u.cdT<=0){ u.cdT=u.cd; u.atkT=0.35; dealDamage(u,t); } }
  } else if(u.state==='move'){
    if(moveToward(u,u.tx,u.ty,dt)) u.state='idle';
  } else u.state='idle';
}
function updateBld(b,dt){
  if(b.buildT>0){
    b.buildT-=dt;
    if(Math.random()<.1) burst(b.x+R(-15,15),b.y+R(-10,10),'#c9a86a',2,40);
    if(b.buildT<=0){ b.hp=b.maxhp; burst(b.x,b.y,'#8fd694',12,70); }
    return;
  }
  const T=G.teams[b.team];
  if(b.cdT>0) b.cdT-=dt;
  // training queue
  if(b.queue.length){
    if(b.qT<=0) b.qT=COST[b.queue[0]].t;
    b.qT-=dt;
    if(b.qT<=0){
      const type=b.queue.shift(); b.qT=0;
      const u=addUnit(b.team,type,b.x+R(-20,20),b.y+(b.team===0?-34:34));
      u.state='move'; u.tx=b.x+R(-30,30); u.ty=b.y+(b.team===0?-60:60);
      burst(u.x,u.y,'#fff',6,50);
    }
  }
  // age research
  if(T.ageT>0&&b.type==='tc'){
    T.ageT-=dt;
    if(T.ageT<=0){ T.age++; T.ageT=0;
      addFloat(b.x,b.y-50,'⬆️ '+AGES[T.age],'#d9b96a');
      burst(b.x,b.y-20,'#ffd94a',24,120);
      if(b.team===0){ sfx.ageup(); banner('⬆️ '+AGES[T.age]+'！'); }
      else banner('⚠️ 敵方進入'+AGES[T.age]+'！');
    }
  }
  // tower shooting
  if(b.type==='tower'&&b.cdT<=0){
    let best=null,bd=STATS.tower.rng;
    for(const e of G.units){ if(e.team===b.team||e.dead) continue;
      const d=dist(b,e); if(d<bd){bd=d;best=e;} }
    if(best){ b.cdT=STATS.tower.cd; b.face=angTo(b,best);
      fireArrow(b,best.x,best.y,best,b.team); }
  }
}
function updateProjs(dt){
  for(const p of G.projs){
    if(p.dead) continue;
    const t=p.target&&!p.target.dead?p.target:null;
    const tx=t?t.x:p.tx, ty=t?t.y:p.ty;
    const dx=tx-p.x, dy=ty-p.y, d=Math.hypot(dx,dy);
    if(d<8){ p.dead=true;
      if(t) dealDamage({dmg:p.dmg,team:p.team,type:'tower',x:p.x,y:p.y},t);
      burst(p.x,p.y,'#c9a86a',3,40);
      continue; }
    p.x+=dx/d*p.sp*dt; p.y+=dy/d*p.sp*dt;
  }
  G.projs=G.projs.filter(p=>!p.dead);
}
function separate(){
  const us=G.units;
  for(let i=0;i<us.length;i++){ const a=us[i]; if(a.dead) continue;
    for(let j=i+1;j<us.length;j++){ const b=us[j]; if(b.dead) continue;
      const dx=b.x-a.x, dy=b.y-a.y, d=Math.hypot(dx,dy);
      if(d>0&&d<14){ const push=(14-d)/2*.5, nx=dx/d, ny=dy/d;
        a.x-=nx*push; a.y-=ny*push; b.x+=nx*push; b.y+=ny*push; } } }
}
// tag helpers
function tagEntities(){
  for(const u of G.units) u.isUnit=true;
  for(const b of G.blds) b.isUnit=false;
}
// ================= ENEMY AI =================
const AI={next:0,ecoT:0,waveT:210};
function aiEconomy(){
  // make sure the AI mines enough gold for its army
  const wantGold=G.blds.some(b=>b.team===1&&!b.dead&&b.type==='barracks')?3:1;
  const vills=G.units.filter(u=>u.team===1&&!u.dead&&u.type==='vill');
  let gold=vills.filter(u=>u.res&&u.res.type==='g'&&u.res.amt>0).length;
  for(const u of vills){
    if(gold>=wantGold) break;
    if(!u.res||u.res.type!=='g'||u.res.amt<=0){
      const m=nearestRes(u,'g');
      if(m){ u.res=m; u.carry='g'; u.state='move'; u.tx=m.x; u.ty=m.y; gold++; }
    }
  }
}
function aiThink(){
  if(G.t<AI.next||G.over) return; AI.next=G.t+1.5;
  if(G.t>AI.ecoT){ AI.ecoT=G.t+6; aiEconomy(); }
  const T=G.teams[1];
  const tc=G.blds.find(b=>b.team===1&&!b.dead&&b.type==='tc');
  const queuedV=tc?tc.queue.filter(q=>q==='vill').length:0;
  const vills=G.units.filter(u=>u.team===1&&!u.dead&&u.type==='vill').length+queuedV;
  const mil=G.units.filter(u=>u.team===1&&!u.dead&&(u.type==='sold'||u.type==='knight')).length;
  const rax=G.blds.find(b=>b.team===1&&!b.dead&&b.type==='barracks');
  const needRax=!rax&&G.t>40;
  // villagers first, but reserve 170 wood for the barracks
  if(vills<8&&!(needRax&&T.wood<170)) trainUnit(1,'vill');
  if(T.pop+2>=T.cap&&!G.blds.some(b=>b.team===1&&!b.dead&&b.type==='house')){
    const s=findSpot(1,'house'); if(s) startBuild(1,'house',s[0],s[1]); }
  if(needRax){ const s=findSpot(1,'barracks'); if(s) startBuild(1,'barracks',s[0],s[1]); }
  if(rax&&rax.buildT<=0&&rax.queue.length<2) trainUnit(1,T.age>=1?'knight':'sold');
  if(T.age===0&&G.t>150&&T.wood>=300&&T.gold>=300) researchAge(1);
  if(T.age===1&&G.t>420&&T.wood>=550&&T.gold>=550) researchAge(1);
  if(T.age>=1&&!G.blds.some(b=>b.team===1&&!b.dead&&b.type==='tower')){
    const s=findSpot(1,'tower'); if(s) startBuild(1,'tower',s[0],s[1]); }
  // attack waves
  if(G.t>AI.waveT&&mil>=3){
    AI.waveT=G.t+110;
    const ptc=G.teams[0].tc;
    if(ptc&&!ptc.dead){
      for(const u of G.units){ if(u.team===1&&!u.dead&&(u.type==='sold'||u.type==='knight')){
        u.target=null; u.state='move'; u.tx=ptc.x+R(-40,40); u.ty=ptc.y+R(-30,30); } }
      banner('⚠️ 敵軍來襲！');
      sfx.boom();
    }
  }
}
// ================= RENDER =================
function fitCanvas(){
  const dpr=Math.min(2,window.devicePixelRatio||1);
  cv.width=420*dpr; cv.height=600*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  cv.style.aspectRatio='420/600';
}
function hpBar(c,x,y,w,pct){
  if(pct>=1) return;
  c.fillStyle='rgba(0,0,0,.5)'; c.fillRect(x-w/2,y,w,5);
  c.fillStyle=pct>.5?'#6fdc5f':pct>.25?'#ffd94a':'#e86a5e';
  c.fillRect(x-w/2+1,y+1,(w-2)*pct,3);
}
function render(){
  ctx.clearRect(0,0,W,H);
  ctx.drawImage(terrain,0,0);
  const t=G.t;
  // resources
  for(const r of G.res){
    if(r.amt<=0) continue;
    if(r.type==='w'){ const s=0.7+0.5*(r.amt/120); drawTree(ctx,r.x,r.y,s,t); }
    else { const s=0.7+0.5*(r.amt/220); drawMine(ctx,r.x,r.y,s,r.amt); }
  }
  // entities sorted by y
  const ents=[...G.blds.filter(b=>!b.dead),...G.units.filter(u=>!u.dead)]
    .sort((a,b)=>(a.y+(a.isUnit?0:a.h/2))-(b.y+(b.isUnit?0:b.h/2)));
  for(const e of ents){
    if(e.isUnit){
      if(e.type==='vill') drawVillager(ctx,e);
      else if(e.type==='sold') drawSoldier(ctx,e);
      else drawKnight(ctx,e);
      hpBar(ctx,e.x,e.y-32,22,e.hp/e.maxhp);
      if(G.sel===e){
        ctx.strokeStyle='#ffe27a'; ctx.lineWidth=2.5;
        ctx.beginPath(); ctx.ellipse(e.x,e.y+9,12,5,0,0,7); ctx.stroke();
      }
    } else {
      drawBuilding(ctx,e,t);
      hpBar(ctx,e.x,e.y-e.h/2-8,e.w*.9,e.hp/e.maxhp);
      if(e.buildT>0){ const p=1-e.buildT/e.buildMax;
        ctx.fillStyle='rgba(0,0,0,.5)'; ctx.fillRect(e.x-20,e.y-e.h/2-16,40,5);
        ctx.fillStyle='#8fd694'; ctx.fillRect(e.x-19,e.y-e.h/2-15,38*p,3); }
      else if(e.queue.length){
        ctx.fillStyle='rgba(0,0,0,.45)'; ctx.font='bold 10px sans-serif'; ctx.textAlign='center';
        ctx.fillText('×'+e.queue.length,e.x+e.w/2-6,e.y-e.h/2-8); }
      if(G.sel===e){
        ctx.strokeStyle='#ffe27a'; ctx.lineWidth=2.5;
        ctx.beginPath(); ctx.ellipse(e.x,e.y+e.h/2+3,e.w*.62,10,0,0,7); ctx.stroke(); }
    }
  }
  // projectiles
  for(const p of G.projs){
    ctx.strokeStyle='#6b4a2a'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(p.x-6,p.y+3); ctx.stroke();
    ctx.fillStyle='#c9d2dc'; ctx.beginPath(); ctx.arc(p.x,p.y,2,0,7); ctx.fill();
  }
  // particles
  for(const p of G.particles){
    ctx.globalAlpha=1-p.t/p.life; ctx.fillStyle=p.color;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.sz,0,7); ctx.fill();
  }
  ctx.globalAlpha=1;
  // floats
  ctx.textAlign='center'; ctx.font='bold 11px sans-serif';
  for(const f of G.floats){
    ctx.globalAlpha=1-f.t/f.life;
    ctx.fillStyle=f.color; ctx.fillText(f.txt,f.x,f.y-f.t*24);
  }
  ctx.globalAlpha=1;
  // placement ghost
  if(G.placeMode&&G.mouse){
    const dims={house:[40,36],barracks:[58,50],tower:[34,54]}[G.placeMode];
    const ok=canPlace(G.placeMode,G.mouse.x,G.mouse.y);
    ctx.globalAlpha=.6; ctx.fillStyle=ok?'#8fd694':'#e86a5e';
    ctx.fillRect(G.mouse.x-dims[0]/2,G.mouse.y-dims[1]/2,dims[0],dims[1]);
    ctx.globalAlpha=1;
    if(G.placeMode==='tower'){
      ctx.strokeStyle='rgba(255,255,255,.5)'; ctx.setLineDash([6,6]);
      ctx.beginPath(); ctx.arc(G.mouse.x,G.mouse.y,STATS.tower.rng,0,7); ctx.stroke();
      ctx.setLineDash([]);
    }
  }
}
// ================= INPUT =================
function evtPos(e){
  const r=cv.getBoundingClientRect();
  return {x:(e.clientX-r.left)/r.width*W, y:(e.clientY-r.top)/r.height*H};
}
cv.addEventListener('pointerdown',e=>{
  if(!G||G.over) return;
  const p=evtPos(e); G.mouse=p;
  if(G.placeMode){
    if(startBuild(0,G.placeMode,p.x,p.y)){ setPlaceMode(null); setHint('點選單位，再點目的地。閒置工人會自動找活幹。'); }
    else setHint('這裡不能蓋，換個位置。');
    return;
  }
  // select own unit (generous hitbox around body)
  let su=null,sd=22;
  for(const u of G.units){ if(u.team!==0||u.dead) continue;
    const d=Math.hypot(u.x-p.x,(u.y-10)-p.y); if(d<sd){sd=d;su=u;} }
  // or own building
  let sb=null;
  if(!su) for(const b of G.blds){ if(b.team!==0||b.dead) continue;
    if(Math.abs(b.x-p.x)<b.w/2+4&&Math.abs(b.y-p.y)<b.h/2+4){ sb=b; break; } }
  if(su){ G.sel=su; sfx.select(); setHint(unitHint(su)); return; }
  if(sb){ G.sel=sb; sfx.select(); return; }
  // order selected unit
  const s=G.sel;
  if(s&&s.isUnit&&s.team===0&&!s.dead){
    if(s.type==='vill'){
      let rr=null,rd=26;
      for(const r of G.res){ if(r.amt<=0) continue;
        const d=Math.hypot(r.x-p.x,r.y-p.y); if(d<rd){rd=d;rr=r;} }
      if(rr){ s.res=rr; s.carry=rr.type; s.state='move'; s.tx=rr.x; s.ty=rr.y; sfx.select(); return; }
    } else {
      let en=null,ed=30;
      for(const x of [...G.units,...G.blds]){ if(x.team!==1||x.dead) continue;
        const d=Math.hypot((x.x-p.x),(x.y-p.y)); if(d<ed){ed=d;en=x;} }
      if(en){ s.target=en; sfx.select(); setHint('攻擊！'); return; }
    }
    s.tx=p.x; s.ty=p.y; s.state='move'; s.target=null;
    if(s.type==='vill'&&s.res){ /* keep res for arrival */ }
    burst(p.x,p.y,'#ffe27a',4,40);
    sfx.select(); return;
  }
  G.sel=null;
});
cv.addEventListener('pointermove',e=>{ if(G) G.mouse=evtPos(e); });
function unitHint(u){
  if(u.type==='vill') return '工人：點樹木或金礦去採集。';
  return '士兵：點敵人攻擊，點地面移動。';
}
function setHint(t){ $('hint').textContent=t; }
// banner toast
let bannerTO=null;
function banner(t){
  let el=$('banner');
  if(!el){ el=document.createElement('div'); el.id='banner';
    el.style.cssText='position:absolute;top:44px;left:50%;transform:translateX(-50%);background:rgba(20,12,6,.85);color:#ffe27a;font-weight:bold;font-size:14px;padding:8px 16px;border-radius:12px;border:2px solid #d9b96a;z-index:10;pointer-events:none;white-space:nowrap;';
    $('wrap').appendChild(el); }
  el.textContent=t; el.style.display='block';
  clearTimeout(bannerTO); bannerTO=setTimeout(()=>el.style.display='none',2600);
}
// ================= COMMANDS =================
function attackAll(){
  const ptc=G.blds.find(b=>b.team===1&&!b.dead&&b.type==='tc');
  if(!ptc){ setHint('敵方老家已毀！'); return; }
  let n=0;
  for(const u of G.units){ if(u.team===0&&!u.dead&&(u.type==='sold'||u.type==='knight')){
    u.target=null; u.state='move'; u.tx=ptc.x+R(-50,50); u.ty=ptc.y+R(-40,40); n++; } }
  if(n){ sfx.boom(); banner('⚔️ 全軍出擊！('+n+')'); setHint('全軍突擊敵方老家！'); }
  else setHint('先在兵營訓練士兵吧。');
}
$('btnVill').onclick=()=>{ if(!trainUnit(0,'vill')) setHint('需要市政中心或資源不足。'); };
$('btnSold').onclick=()=>{ if(!trainUnit(0,'sold')) setHint('需要兵營，30🪵+40🪙。'); };
$('btnKnight').onclick=()=>{ if(!trainUnit(0,'knight')) setHint('買房時代解鎖，50🪵+80🪙。'); };
$('btnBuild').onclick=()=>{
  if(G.placeMode){ setPlaceMode(null); setHint('已取消建造。'); return; }
  $('buildmenu').classList.add('show');
};
$('buildCancel').onclick=()=>{ $('buildmenu').classList.remove('show'); };
function setPlaceMode(t){
  $('placeCancel').style.display=t?'block':'none';
  G.placeMode=t;
}
document.querySelectorAll('.bbtn[data-b]').forEach(b=>b.onclick=()=>{
  const t=b.dataset.b, T=G.teams[0], c=COST[t];
  if(t==='tower'&&T.age<1){ setHint('高塔要買房時代才解鎖。'); return; }
  if(T.wood<c.w||T.gold<c.g){ setHint('資源不足，蓋不起。'); return; }
  setPlaceMode(t); $('buildmenu').classList.remove('show');
  setHint('點地圖選擇建造位置。');
});
$('placeCancel').onclick=()=>{ setPlaceMode(null); setHint('已取消建造。'); };
$('btnAge').onclick=()=>{
  if(researchAge(0)) banner('⬆️ 升級中…');
  else setHint('資源不足或已在最高時代。');
};
$('btnAttack').onclick=attackAll;
$('muteBtn').onclick=e=>{ muted=!muted; e.target.textContent=muted?'🔇':'🔊'; };
// ================= HUD =================
function fmtT(s){ return Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0'); }
function updateHUD(){
  const T=G.teams[0];
  $('rWood').textContent=Math.floor(T.wood);
  $('rGold').textContent=Math.floor(T.gold);
  let pop=0; for(const u of G.units) if(u.team===0&&!u.dead) pop+=STATS[u.type].pop;
  T.pop=pop;
  $('rPop').textContent=pop; $('rCap').textContent=T.cap;
  $('ageTag').textContent=AGES[T.age]+(T.ageT>0?' ⬆':'');
  $('timer').textContent=fmtT(G.t);
  const bv=$('btnVill'), bs=$('btnSold'), bk=$('btnKnight'), ba=$('btnAge');
  bv.disabled=!(T.wood>=COST.vill.w&&T.pop+1<=T.cap&&G.blds.some(b=>b.team===0&&!b.dead&&b.type==='tc'));
  bs.disabled=!(T.wood>=COST.sold.w&&T.gold>=COST.sold.g&&T.pop+1<=T.cap&&G.blds.some(b=>b.team===0&&!b.dead&&b.type==='barracks'&&b.buildT<=0));
  bk.disabled=!(T.age>=1&&T.wood>=COST.knight.w&&T.gold>=COST.knight.g&&T.pop+1<=T.cap&&G.blds.some(b=>b.team===0&&!b.dead&&b.type==='barracks'&&b.buildT<=0));
  const ac=T.age===0?COST.age1:T.age===1?COST.age2:null;
  ba.innerHTML=ac?`⬆️ 升級時代<br><small>${ac.w}🪵 ${ac.g}🪙</small>`:'👑 最高時代';
  ba.disabled=!ac||T.ageT>0||T.wood<ac.w||T.gold<ac.g;
}
// ================= GAME OVER =================
function endGame(win){
  if(G.over) return;
  G.over=true; G.win=win;
  sfx.boom(); setTimeout(()=>sfx.ageup(),400);
  $('endTitle').textContent=win?'🏆 勝利！':'💀 戰敗…';
  $('endStats').innerHTML=
    (win?'包租公的老家被推平了！租客聯盟萬歲！':'你的老家被拆了…包租公露出了微笑。')+
    `<br>⏱️ ${fmtT(G.t)}<br>⚔️ 殲敵 ${G.stats.kills} · 損失 ${G.stats.lost}`;
  setTimeout(()=>$('endScr').classList.remove('hidden'),900);
}
// ================= MAIN LOOP =================
let lastT=0;
function loop(ts){
  requestAnimationFrame(loop);
  if(!G) return;
  const dt=Math.min(0.05,(ts-lastT)/1000||0.016); lastT=ts;
  if(!G.started){ render(); return; }
  if(!G.over){
    G.t+=dt;
    tagEntities();
    aiThink();
    for(const u of G.units) if(!u.dead) updateUnit(u,dt);
    for(const b of G.blds) if(!b.dead) updateBld(b,dt);
    updateProjs(dt);
    separate();
    for(const p of G.particles){ p.t+=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=140*dt; }
    G.particles=G.particles.filter(p=>p.t<p.life);
    for(const f of G.floats) f.t+=dt;
    G.floats=G.floats.filter(f=>f.t<f.life);
    for(const e of G.units){ if(e.flashT>0) e.flashT-=dt; }
    for(const e of G.blds){ if(e.flashT>0) e.flashT-=dt; }
    if(G.units.length>240) G.units=G.units.filter(u=>!u.dead);
    if(G.blds.length>60) G.blds=G.blds.filter(b=>!b.dead);
  }
  render();
  updateHUD();
}
// ================= INIT =================
$('startBtn').onclick=()=>{ $('titleScr').classList.add('hidden'); G.started=true; sfx.ageup(); };
$('againBtn').onclick=()=>location.reload();
fitCanvas();
window.addEventListener('resize',fitCanvas);
newGame();
tagEntities();
requestAnimationFrame(loop);
</script>
