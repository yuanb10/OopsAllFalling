name: Deploy Tidy Rush to itch.io

on:
  push:
    branches: [main]
    paths:
      - 'tidy-rush/**'
      - '.github/workflows/deploy-tidy-rush.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install butler
        run: |
          curl -L --retry 5 --retry-all-errors --retry-delay 5 -o butler.zip https://github.com/itchio/butler/releases/download/v15.31.0/butler-linux-amd64.zip
          unzip -o butler.zip -d butler
          chmod +x butler/butler
          ./butler/butler -V

      - name: Push to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: ./butler/butler push tidy-rush/ oopsallfalling/tidy-rush:main --userversion ${{ github.sha }}
